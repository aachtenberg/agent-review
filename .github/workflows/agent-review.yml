# This repo reviews its own PRs with the workflow and config on main.
name: Agent Review
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    # Same-repo PRs only, and /review only from the repo owner or an org
    # member (in an org-owned repo the owner's comments carry MEMBER).
    if: >-
      (github.event_name == 'pull_request_target'
        && github.event.pull_request.draft == false
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association)
        && startsWith(github.event.comment.body, '/review'))
    uses: ./.github/workflows/review.yml
    with:
      runner: ubuntu-latest
      config_ref: main
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
