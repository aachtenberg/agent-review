name: Agent Review (reusable)
# An agentic PR review: OpenCode (MIT, github.com/anomalyco/opencode) works on
# a full checkout of the PR. It runs git diff/log/show, reads files, greps for
# callers, and follows the change through the repo before writing a short
# review, posted as a PR comment.
#
# Called from a small workflow in each repo (see examples/agent-review.yml).
# The prompt, the OpenCode config, the git wrapper and the renderer are read
# from this repo at `config_ref`, never from the repo under review, so a PR
# cannot change how it is reviewed.
#
# Model: any OpenCode provider/model. The default is GLM 5.3 Flash via
# OpenRouter (needs the OPENROUTER_API_KEY secret). With `fallback_model`
# set, a failed first attempt (or a missing key) is retried once with it,
# e.g. a local Ollama model on a self-hosted runner. The comment's footer
# names the model that wrote the review.
#
# Re-reviews: when the PR already has a review by the main model, the next
# one checks that review's findings and reviews only the commits since
# (review/previous.py decides; review/scope-rereview.md says how).
# `/review full` reviews the whole PR again.
#
# No review: a model sometimes stops early (it announces its next step and
# makes no tool call, which ends the run) or writes nothing. The agent is
# then asked once more, in the same session, to write the review from what
# it has read. If there is still none and a fallback is set, the fallback
# reviews. A run that ends without a review keeps the agent's events as an
# artifact (agent-review-events-<attempt>, 14 days), to tell a model that stopped from
# a stream that was cut.
#
# Status: each run sets an `agent-review` commit status on the PR's head
# commit: pending while it runs, then success (the review was posted; the
# description gives the finding counts), failure (no review) or error
# (cancelled, e.g. replaced by a newer /review). GitHub attaches a /review
# run's own check to the default branch's latest commit, not to the PR, so
# the status is what shows the result on the PR, and what branch protection
# can require. It needs `statuses: write`, which every caller must grant
# too: GitHub won't start this workflow for a caller that grants less than
# the job asks for. deploy/release.sh checks every caller before moving v1.
#
# Isolation: the PR's code is untrusted input to an agent that runs commands.
#   - Same-repo PRs only (fork PRs never run), /review only from the owner
#     or an org member (author_association OWNER or MEMBER).
#   - The agent runs in a throwaway container; the PR checkout is mounted
#     read-only; OPENCODE_DISABLE_PROJECT_CONFIG ignores any opencode.json or
#     AGENTS.md the PR adds.
#   - OpenCode permissions deny everything except read/grep/glob/list inside
#     the checkout and one shell command, git-ro (review/git-ro). OpenCode's
#     bash rules are globs over the raw command string, which shell quoting
#     gets past, so the boundary is the wrapper: it sees the argv git gets,
#     allows diff|log|show|blame|merge-base with a fixed option list (no
#     --output, --no-index, external diff/textconv), requires every path to
#     resolve inside the checkout, and execs git with an empty environment.
#     The bash rules also refuse $ ` < > (no substitution, no redirects).
#   - Symlinks in the PR that resolve outside the checkout are replaced with
#     a placeholder before it is mounted (OpenCode's read tool follows them).
#   - OPENROUTER_API_KEY goes into the container only for an openrouter/
#     model. GITHUB_TOKEN never does; checkouts use persist-credentials:
#     false, and the comment is posted after the container has exited.
on:
  workflow_call:
    inputs:
      runner:
        description: runs-on label. Public repos use GitHub-hosted; private repos our self-hosted runner.
        type: string
        default: ubuntu-latest
      model:
        description: OpenCode provider/model for the review.
        type: string
        default: openrouter/z-ai/glm-5.3-flash
      fallback_model:
        description: Model to retry with once if the first attempt fails or has no key. Empty for none.
        type: string
        default: ""
      ollama_base_url:
        description: OpenAI-compatible Ollama endpoint for ollama/ models, e.g. http://host:11434/v1.
        type: string
        default: ""
      config_ref:
        description: Ref of aachtenberg/agent-review to read the prompt and config from. Keep it equal to the ref in `uses:`.
        type: string
        default: v1
    secrets:
      OPENROUTER_API_KEY:
        required: false

env:
  # Built from image/ by image.yml: OpenCode, git and ripgrep, so a run fetches
  # no code. Pinned by digest; take the new one from image.yml's run summary.
  AGENT_IMAGE: ghcr.io/aachtenberg/agent-review@sha256:98e24a871ec14ef49da0e82f7e72a74263d47b66c21d8edeb82b994f0be8e9d9
  MODEL: ${{ inputs.model }}
  FALLBACK_MODEL: ${{ inputs.fallback_model }}
  OLLAMA_BASE_URL: ${{ inputs.ollama_base_url }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  # Holds OpenCode's session between an attempt and asking it again.
  SESSION_VOLUME: agent-review-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  agent-review:
    # The caller applies the same guard; repeated here so a careless caller
    # cannot open the reviewer to forks or other commenters.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_target'
        && github.event.pull_request.draft == false
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association)
        && startsWith(github.event.comment.body, '/review'))
    # A newer /review (or reopen) supersedes a run in progress. This lives
    # here, on the job, rather than in the caller: a caller run whose job is
    # skipped (any other comment, e.g. a bot's) never reaches this workflow,
    # so it never joins the group and can't cancel a live review. Callers
    # carry no concurrency of their own; the group name differs from the
    # old caller-level one so a not-yet-updated caller can't deadlock it.
    concurrency:
      group: agent-review-run-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # The agent-review status on the PR's head commit.
      statuses: write
    # Two attempts of at most 15 minutes each, each asked again for at most
    # 5 minutes if it wrote no review, plus setup.
    timeout-minutes: 45
    steps:
      - name: Resolve the PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "$RUNNER_TEMP/pr.json"
          python3 - "$RUNNER_TEMP/pr.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys
          pr = json.load(open(sys.argv[1]))
          # issue_comment carries no head repo; enforce the fork guard here.
          if pr["head"]["repo"] is None or pr["head"]["repo"]["full_name"] != os.environ["GITHUB_REPOSITORY"]:
              sys.exit("refusing: PR head is not in this repository")
          print(f"number={pr['number']}")
          print(f"head_sha={pr['head']['sha']}")
          print(f"base_sha={pr['base']['sha']}")
          print(f"base_ref={pr['base']['ref']}")
          PY
          if [ "${GITHUB_EVENT_NAME}" = issue_comment ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" -f content=eyes >/dev/null || true
          fi

      - name: Set the status to pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" -f context=agent-review \
            -f state=pending -f description=Reviewing -f target_url="$RUN_URL" >/dev/null \
            || echo "::warning::couldn't set the agent-review status on ${HEAD_SHA:0:7}"

      - name: Check out the reviewer (aachtenberg/agent-review)
        uses: actions/checkout@v4
        with:
          repository: aachtenberg/agent-review
          ref: ${{ inputs.config_ref }}
          path: reviewer
          persist-credentials: false
          sparse-checkout: review
          sparse-checkout-cone-mode: false

      - name: Check out the PR
        uses: actions/checkout@v4
        with:
          path: pr
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Neutralize symlinks that leave the checkout
        run: |
          set -euo pipefail
          root=$(realpath pr)
          find pr -type l -print0 | while IFS= read -r -d '' l; do
            target=$(readlink -- "$l"); resolved=$(realpath -m -- "$l")
            case "$resolved" in "$root"|"$root"/*) ;; *)
              rm -- "$l"
              printf '[agent-review: symlink to %s removed, it points outside the repository]\n' "$target" > "$l"
              echo "neutralized: ${l#pr/} -> $target" ;;
            esac
          done

      # A re-review builds on the last review by the main model: it checks
      # those findings and reviews the commits since. previous.py falls back
      # to a full review when that can't work (rebase, merge, `/review full`).
      # It reads only this workflow's own comments (github-actions[bot]).
      - name: Find the last review
        id: prev
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          # Matched against `/review full` only; never run or substituted.
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if ! gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              --jq '.[] | {login: .user.login, body: .body}' > "$RUNNER_TEMP/comments.jsonl"; then
            echo "::warning::couldn't list the PR's comments; reviewing the whole PR"
            : > "$RUNNER_TEMP/comments.jsonl"
          fi
          python3 -I reviewer/review/previous.py "$RUNNER_TEMP/comments.jsonl" pr "$HEAD_SHA" \
            "$RUNNER_TEMP/earlier.md" | tee -a "$GITHUB_OUTPUT"

      - name: Review
        env:
          # Handed to the container only for an openrouter/ model (below).
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          # Empty for a full review.
          PREV_SHA: ${{ steps.prev.outputs.prev_sha }}
        run: |
          set -euo pipefail
          cfg="$GITHUB_WORKSPACE/reviewer/review"
          [ -f "$RUNNER_TEMP/earlier.md" ] || : > "$RUNNER_TEMP/earlier.md"
          # fetch-depth: 0 brought every branch, so BASE_SHA is present for
          # `git-ro diff BASE...HEAD` inside the container.
          git -C pr cat-file -e "$BASE_SHA^{commit}"
          # Repo-specific review notes, read from the BASE commit so the PR
          # under review cannot rewrite its own instructions. Optional.
          git -C pr show "$BASE_SHA:.github/agent-review.md" > "$RUNNER_TEMP/notes.md" 2>/dev/null || : > "$RUNNER_TEMP/notes.md"
          # Plain string replacement: a ref may contain / & or \, which a sed
          # replacement would misread.
          # The scope is the opening of a full review or of a re-review. The
          # earlier findings go in last, so nothing in them is substituted.
          prompt="$(python3 -I -c 'import os,sys
          cfg, prev = sys.argv[1], os.environ.get("PREV_SHA", "")
          t = open(cfg + "/prompt.md").read()
          scope = open(cfg + ("/scope-rereview.md" if prev else "/scope-full.md")).read().strip()
          t = t.replace("{{SCOPE}}", scope)
          for k in ("BASE_SHA", "HEAD_SHA", "BASE_REF", "PR_NUMBER", "PREV_SHA"):
              t = t.replace("{{" + k + "}}", os.environ.get(k, ""))
          if prev:
              t = t.replace("{{PREV_FINDINGS}}", open(sys.argv[3]).read().strip() or "(none recorded)")
          notes = open(sys.argv[2]).read().strip()[:4000]
          if notes:
              t += "\n## Notes for this repository (from .github/agent-review.md)\n\n" + notes + "\n"
          sys.stdout.write(t)' "$cfg" "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/earlier.md")"
          # OpenCode's sessions, kept between the attempt and the ask-again
          # below. A named volume, not a directory: the container writes as
          # root, and the runner couldn't clean that out of its temp dir.
          # The last step removes it.
          docker volume create "$SESSION_VOLUME" >/dev/null
          # run_agent MODEL SECONDS OUT ARGS...: one `opencode run ARGS` of at
          # most SECONDS; events to OUT, stderr appended to agent.log. The
          # key goes in only for openrouter/.
          run_agent() {
            local model=$1 limit=$2 out=$3 key_env=()
            shift 3
            case "$model" in openrouter/*) key_env=(-e OPENROUTER_API_KEY) ;; esac
            echo "=== $model" >> "$RUNNER_TEMP/agent.log"
            docker run --rm --init --pull=missing --memory=4g --cpus=2 \
              -v "$GITHUB_WORKSPACE/pr:/work:ro" \
              -v "$SESSION_VOLUME:/root/.local/share/opencode" \
              -v "$cfg/opencode.json:/cfg/opencode.json:ro" \
              -v "$cfg/git-ro:/usr/local/bin/git-ro:ro" \
              -w /work \
              -e OPENCODE_CONFIG=/cfg/opencode.json \
              -e OPENCODE_DISABLE_PROJECT_CONFIG=1 \
              -e OPENCODE_DISABLE_AUTOUPDATE=1 \
              -e OLLAMA_BASE_URL \
              "${key_env[@]}" \
              "$AGENT_IMAGE" \
              timeout "$limit" opencode run --model "$model" --format json "$@" \
              > "$out" 2>> "$RUNNER_TEMP/agent.log"
          }
          # render.py decides what counts as a review, here as in the comment.
          has_review() { python3 -I "$cfg/render.py" --check "$RUNNER_TEMP/events.jsonl"; }
          ask='You stopped without writing the review. Write it now, from what you have already read; make another tool call only if a finding still needs one check. Your whole message is the <<<REVIEW ... REVIEW>>> block in the format given above: either the findings, or "No issues found." with its "Checked:" line.'
          # attempt MODEL: one review by MODEL, events to events.jsonl. If it
          # exits cleanly without a review, it is asked once more in the same
          # session, and those events are added. Returns the first run's
          # exit code; has_review says whether there is a review.
          nudged=""
          attempt() {
            local arc=0
            run_agent "$1" 900 "$RUNNER_TEMP/events.jsonl" "$prompt" || arc=$?
            if [ "$arc" = 0 ] && ! has_review; then
              echo "::notice::$1 finished without a review; asking it once more"
              echo "=== asking again" >> "$RUNNER_TEMP/agent.log"
              nudged=1
              run_agent "$1" 300 "$RUNNER_TEMP/again.jsonl" --continue "$ask" \
                || echo "asking again exited $?" >> "$RUNNER_TEMP/agent.log"
              cat "$RUNNER_TEMP/again.jsonl" >> "$RUNNER_TEMP/events.jsonl"
              rm -f "$RUNNER_TEMP/again.jsonl"
            fi
            return "$arc"
          }
          start=$(date +%s)
          used=$MODEL fell_back="" note="" rc=0
          if [[ $MODEL == openrouter/* && -z ${OPENROUTER_API_KEY:-} ]]; then
            fell_back="no OPENROUTER_API_KEY in this repo" rc=1
          else
            attempt "$MODEL" || rc=$?
            if [ "$rc" != 0 ]; then
              fell_back="$MODEL exited $rc"
            elif ! has_review; then
              fell_back="$MODEL wrote no review"
            fi
          fi
          if [ -n "$fell_back" ] && [ -n "${FALLBACK_MODEL:-}" ] && [ "$FALLBACK_MODEL" != "$MODEL" ]; then
            echo "::warning::agent-review falling back to $FALLBACK_MODEL: $fell_back"
            [ ! -s "$RUNNER_TEMP/events.jsonl" ] || mv "$RUNNER_TEMP/events.jsonl" "$RUNNER_TEMP/events-primary.jsonl"
            used=$FALLBACK_MODEL rc=0 nudged=""
            attempt "$FALLBACK_MODEL" || rc=$?
          elif [ -n "$fell_back" ]; then
            # No fallback configured: report why the review did not run. A
            # clean exit without a review needs no note; render.py says so.
            [ "$rc" = 0 ] || note=$fell_back
            fell_back=""
          fi
          echo "agent exited $rc" >> "$RUNNER_TEMP/agent.log"
          # The events and the log may be kept as an artifact (below), which
          # GitHub does not mask: take the key out, should a tool have echoed it.
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            python3 -I -c 'import os, sys
          key = os.environ["OPENROUTER_API_KEY"].encode()
          for p in sys.argv[1:]:
              if os.path.exists(p):
                  b = open(p, "rb").read()
                  if key in b:
                      open(p, "wb").write(b.replace(key, b"***"))' \
              "$RUNNER_TEMP/events.jsonl" "$RUNNER_TEMP/events-primary.jsonl" "$RUNNER_TEMP/agent.log"
          fi
          # The post step reports a failed agent and then fails the job.
          {
            echo "AGENT_RC=$rc"
            echo "AGENT_NOTE=$note"
            echo "MODEL_USED=$used"
            echo "FELL_BACK=$fell_back"
            echo "NUDGED=$nudged"
            echo "ELAPSED=$(( $(date +%s) - start ))"
          } >> "$GITHUB_ENV"
          tail -30 "$RUNNER_TEMP/agent.log" || true

      - name: Post the review
        id: post
        # Not when cancelled: a run superseded by a newer /review posts nothing.
        if: ${{ !cancelled() && steps.pr.outputs.number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REVIEW_SCOPE: ${{ steps.prev.outputs.scope }}
        run: |
          set -euo pipefail
          SUMMARY_OUT="$RUNNER_TEMP/summary.txt" \
            python3 -I reviewer/review/render.py "$RUNNER_TEMP/events.jsonl" > "$RUNNER_TEMP/comment.md"
          url=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@"$RUNNER_TEMP/comment.md" --jq .html_url)
          echo "$url"
          echo "comment_url=$url" >> "$GITHUB_OUTPUT"
          # AGENT_RC is unset when the Review step failed before the agent ran.
          if [ "${AGENT_RC:-}" != 0 ]; then
            echo "::error::the agent did not finish (exit ${AGENT_RC:-not run}); a failure comment was posted"
            exit 1
          fi
          # render.py heads every no-review comment with ⚠️ (failed, or
          # finished without a review block): that is a failed run too.
          if head -n1 "$RUNNER_TEMP/comment.md" | grep -q '⚠️'; then
            echo "::error::the agent finished without a review; a comment saying so was posted"
            exit 1
          fi

      # What the agent did, when the run ended without a review: every
      # step's finish reason is in the events. Not kept for a posted review.
      - name: Keep the agent's events from a failed run
        if: failure() && steps.pr.outputs.number
        uses: actions/upload-artifact@v4
        with:
          name: agent-review-events-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/events.jsonl
            ${{ runner.temp }}/events-primary.jsonl
            ${{ runner.temp }}/agent.log
          if-no-files-found: ignore
          retention-days: 14

      # Finish signal on a /review comment, next to the 👀 added at start:
      # 🚀 when the review was posted, 👎 when the run failed. A run cancelled
      # by a newer /review gets neither; the newer run reacts on its comment.
      - name: React to the /review comment
        if: (success() || failure()) && github.event_name == 'issue_comment' && steps.pr.outputs.number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_ID: ${{ github.event.comment.id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then reaction=rocket; else reaction=-1; fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" \
            -f content="$reaction" >/dev/null || true

      # The result on the PR's head commit. Success and failure link to the
      # comment, and render.py wrote the description. A cancelled run sets
      # error. When a newer /review replaced it, that run's own result comes
      # minutes later and is the last word.
      - name: Set the status to the result
        if: always() && steps.pr.outputs.head_sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          JOB_STATUS: ${{ job.status }}
          COMMENT_URL: ${{ steps.post.outputs.comment_url }}
        run: |
          desc=$(cat "$RUNNER_TEMP/summary.txt" 2>/dev/null || true)
          url=${COMMENT_URL:-$RUN_URL}
          case "$JOB_STATUS" in
            success) state=success ;;
            cancelled) state=error desc="Cancelled: replaced by a newer review, or stopped" url=$RUN_URL ;;
            *) state=failure
               [ -n "$COMMENT_URL" ] || desc="The run failed before posting a review" ;;
          esac
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" -f context=agent-review \
            -f state="$state" -f description="${desc:-Review posted}" -f target_url="$url" >/dev/null \
            || echo "::warning::couldn't set the agent-review status on ${HEAD_SHA:0:7}"

      - name: Remove the session volume
        if: always()
        run: docker volume rm -f "$SESSION_VOLUME" >/dev/null 2>&1 || true
